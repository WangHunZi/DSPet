dependencies:
  espressif/esp-sr:
    version: "==2.6.1"
    require: private
    rules:
      - if: "$CONFIG{DSPET_AEC} == True"
  espressif/cjson:
    version: "==1.7.19~2"
    require: private
    rules:
      - if: "$CONFIG{DSPET_DIRECT_TEST} == True"
  espressif/qrcode:
    version: "==0.2.0"
    require: private
    rules:
      - if: "$CONFIG{DSPET_PROVISIONING} == True"
